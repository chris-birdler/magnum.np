bump-version:
    stage: deploy
    script:
        - export PUSH_REPO=$(echo "$CI_REPOSITORY_URL" | sed -e "s|.*@\(.*\)|git@\1|" -e "s|/|:/|" )
        - sed -i -e "s/VERSION = .*/VERSION = $CI_COMMIT_TAG/g" magnumnp/__init__.py
        - echo $CI_COMMIT_TAG_MESSAGE >> CHANGELOG
        - git config --global user.email "you@example.com"
        - git config --global user.name "Gitlab Bump-Version"
        - git add --all && git commit -m "auto-increment"
        - git remote set-url --push origin "${PUSH_REPO}"
        - git push origin HEAD:$CI_COMMIT_REF_NAME
#    dependencies:
#        - test
    only:
        - tags

build-package:
    stage: deploy
    before_script:
        - python -m pip install --upgrade twine
        - python -m pip install --upgrade build
        - sed -i -e "s/v-latest/$CI_COMMIT_TAG/" setup.py
        - cat setup.py
    variables:
        TWINE_USERNAME: $PYPI_USERNAME
        TWINE_PASSWORD: $PYPI_PASSWORD
    script:
        - python -m build
        - python -m twine upload dist/*
    only:
        - tags

